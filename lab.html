<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>기울기 자전거 — 효과 실험실</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1d2b; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left));
    right: calc(10px + env(safe-area-inset-right)); display: none; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 5; }
  .hud .label { background: rgba(15,29,43,.55); padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .hud .timer { background: rgba(15,29,43,.55); padding: 6px 14px; border-radius: 999px; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 86px; text-align: center; }
  .hud .btns { display: flex; gap: 8px; pointer-events: auto; }
  .round { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(15,29,43,.6); color: #fff;
    font-size: 20px; display: grid; place-items: center; touch-action: manipulation; cursor: pointer; }
  .hint { position: fixed; left: 50%; top: calc(60px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: rgba(15,29,43,.72); padding: 8px 16px; border-radius: 12px; font-size: 15px; max-width: 78vw; text-align: center;
    transition: opacity .6s; pointer-events: none; z-index: 5; line-height: 1.4; opacity: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(201,72,52,.92); padding: 8px 16px; border-radius: 12px; font-size: 15px; transition: opacity .4s;
    pointer-events: none; z-index: 30; white-space: nowrap; opacity: 0; }
  .touchhint { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; display: flex;
    justify-content: space-between; padding: 0 calc(16px + env(safe-area-inset-left)) 0 calc(16px + env(safe-area-inset-right)); pointer-events: none; z-index: 4;
    font-size: 13px; color: rgba(255,255,255,.85); text-shadow: 0 1px 3px rgba(0,0,0,.6); transition: opacity .8s; opacity: 0; }
  .ov { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10;
    background: rgba(10,20,32,.72); padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
  .ov.show { display: flex; }
  .ov.clear { background: transparent; }
  .card { background: #fffdf7; color: #1d2a36; border-radius: 18px; padding: 16px 20px; max-width: 580px; width: 100%;
    max-height: 100%; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); text-align: center; touch-action: pan-y; position: relative; }
  .card h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.5px; }
  .card h2 { margin: 0 0 6px; font-size: 21px; }
  .card p { margin: 6px 0; font-size: 15px; line-height: 1.5; color: #3a4a58; }
  .card .small { font-size: 13px; color: #6b7a87; }
  .btn { border: 0; border-radius: 12px; padding: 12px 18px; font-size: 16px; font-weight: 700; margin: 6px 4px 0;
    background: #2b6cb0; color: #fff; cursor: pointer; touch-action: manipulation; font-family: inherit; }
  .btn.sub { background: #e3e9ef; color: #1d2a36; }
  .btn.ok { background: #2f9e57; }
  .btn.warn { background: #c94834; }
  .btn:disabled { opacity: .45; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0 6px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 6px; }
  .tile { border: 0; border-radius: 12px; padding: 10px 4px; background: #e8f1f8; color: #1d2a36; font-size: 13px;
    font-weight: 700; cursor: pointer; touch-action: manipulation; line-height: 1.3; font-family: inherit; position: relative; }
  .tile .n { font-size: 22px; display: block; }
  .tile .stars { display: block; font-size: 12px; color: #e0a500; letter-spacing: 1px; min-height: 15px; }
  .tile.done { background: #d5f0dc; }
  .tile.locked { background: #eef0f2; color: #9aa6b1; }
  .tile.world { padding: 14px 6px; }
  .tile.world .n { font-size: 30px; }
  .tile.world .wn { font-size: 15px; }
  .tile.world .ws { color: #e0a500; font-size: 13px; }
  .topline { display: flex; justify-content: space-between; align-items: center; }
  .topline h2 { margin: 0; }
  .link { background: none; border: 0; color: #2b6cb0; font-weight: 700; font-size: 15px; cursor: pointer; padding: 6px 8px; font-family: inherit; }
  .diag { text-align: left; font: 13px/1.55 ui-monospace, Menlo, monospace; background: #f1f4f7; border-radius: 10px;
    padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; color: #1d2a36; }
  .warn { color: #b0402c; font-weight: 700; }
  a { color: #2b6cb0; word-break: break-all; }
  .big { font-size: 44px; line-height: 1; margin-bottom: 4px; }
  .setrow { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; border-bottom: 1px solid #edf0f3; font-size: 15px; }
  .setrow .seg { display: flex; gap: 4px; }
  .seg button { border: 1px solid #c9d3dc; background: #fff; color: #1d2a36; border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .seg button.on { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  .starbig { font-size: 40px; letter-spacing: 4px; color: #d8d8d8; margin: 2px 0 4px; }
  .starbig .lit { color: #f5b400; text-shadow: 0 2px 6px rgba(245,180,0,.45); }
  .res { display: flex; justify-content: center; gap: 18px; font-size: 15px; color: #3a4a58; }
  .res b { color: #1d2a36; }
  .cover { position: fixed; inset: 0; background: #0f1d2b; z-index: 50; display: none; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
  .cover.show { display: flex; }
  #title { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; z-index: 10;
    padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  #title.show { display: flex; }
  #title .tcard { background: rgba(15,29,43,.72); border-radius: 18px; padding: 14px 22px; text-align: center; max-width: 520px; backdrop-filter: blur(4px); }
  #title h1 { margin: 0; font-size: 40px; letter-spacing: -1px; text-shadow: 0 3px 10px rgba(0,0,0,.5); }
  #title .tap { margin-top: 8px; font-size: 16px; opacity: .9; animation: blink 1.6s infinite; }
  #title .tbtns { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); display: flex; gap: 8px; }
  @keyframes blink { 0%, 100% { opacity: .95 } 50% { opacity: .4 } }
  #stageLabel .w { opacity: .7; font-weight: 600; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="cover show" id="cover">Loading…</div>

<div id="title">
  <div class="tbtns"><button class="round" id="bLang" aria-label="language">A</button><button class="round" id="bTitleSet" aria-label="settings">⚙</button></div>
  <div class="tcard"><h1 id="titleH1">Tilt Bike</h1><div class="tap" id="tapToStart">Tap to start</div></div>
</div>

<div class="hud" id="hud">
  <div class="label" id="stageLabel"></div>
  <div class="timer" id="timer">0.0</div>
  <div class="btns">
    <button class="round" id="bView" aria-label="view">🎥</button>
    <button class="round" id="bRestart" aria-label="restart">↻</button>
    <button class="round" id="bPause" aria-label="pause">‖</button>
  </div>
</div>
<div class="hint" id="hint"></div>
<div class="toast" id="toast"></div>
<div class="touchhint" id="touchhint"><span id="thL"></span><span id="thR"></span></div>

<div class="ov" id="ovInput"><div class="card">
  <div class="big">🚲</div>
  <h1 id="inTitle"></h1>
  <p id="inLine1"></p><p id="inLine2"></p>
  <div class="row" id="inBtns">
    <button class="btn" id="bTilt"></button>
    <button class="btn sub" id="bTouch"></button>
  </div>
  <p class="small" id="inNote"></p>
</div></div>

<div class="ov" id="ovSensorFail"><div class="card">
  <h2 id="sfTitle"></h2>
  <p id="failWhy"></p>
  <div class="diag" id="failDiag"></div>
  <div class="row"><button class="btn" id="bRetryTilt"></button><button class="btn sub" id="bUseTouch"></button></div>
</div></div>

<div class="ov" id="ovCalib"><div class="card">
  <div class="big">📱↔️</div>
  <h2 id="calTitle"></h2>
  <p id="calText"></p>
  <button class="btn" id="bCalibGo"></button>
</div></div>

<div class="ov" id="ovWorlds"><div class="card">
  <div class="topline"><button class="link" id="bWorldsBack"></button><h2 id="worldsTitle"></h2><span class="small" id="worldsStars"></span></div>
  <div class="grid3" id="worldList"></div>
  <div class="row"><button class="btn sub" id="bWorldsSet"></button></div>
</div></div>

<div class="ov" id="ovStages"><div class="card">
  <div class="topline"><button class="link" id="bStagesBack"></button><h2 id="stagesTitle"></h2><span class="small" id="stagesStars"></span></div>
  <div class="grid5" id="stageList"></div>
  <p class="small" id="stagesNote"></p>
</div></div>

<div class="ov" id="ovPause"><div class="card">
  <h2 id="pauseTitle"></h2>
  <div class="row"><button class="btn ok" id="bResume"></button><button class="btn" id="bPRestart"></button><button class="btn sub" id="bPList"></button></div>
  <div class="row"><button class="btn sub" id="bPSet"></button></div>
</div></div>

<div class="ov" id="ovResult"><div class="card">
  <div class="big" id="resIcon"></div>
  <h2 id="resTitle"></h2>
  <div class="starbig" id="resStars"></div>
  <div class="res" id="resNums"></div>
  <p id="resText"></p>
  <div class="row"><button class="btn ok" id="bNext"></button><button class="btn" id="bAgain"></button><button class="btn sub" id="bList"></button></div>
</div></div>

<div class="ov" id="ovSettings"><div class="card">
  <div class="topline"><button class="link" id="bSetBack"></button><h2 id="setTitle"></h2><span></span></div>
  <div class="setrow"><span id="lblSound"></span><div class="seg" id="segSound"></div></div>
  <div class="setrow"><span id="lblMusic"></span><div class="seg" id="segMusic"></div></div>
  <div class="setrow"><span id="lblVib"></span><div class="seg" id="segVib"></div></div>
  <div class="setrow"><span id="lblInput"></span><div class="seg" id="segInput"></div></div>
  <div class="setrow"><span id="lblView"></span><div class="seg" id="segView"></div></div>
  <div class="setrow"><span id="lblLang"></span><div class="seg" id="segLang"></div></div>
  <div class="row"><button class="btn sub" id="bRecalib"></button><button class="btn sub" id="bDiag"></button><button class="btn warn" id="bReset"></button></div>
</div></div>

<div class="ov" id="ovDiag"><div class="card">
  <h2 id="diagTitle"></h2>
  <p class="small" id="diagHelp"></p>
  <div class="diag" id="diagText"></div>
  <div class="row"><button class="btn sub" id="bDiagCalib"></button><button class="btn sub" id="bInvert"></button><button class="btn" id="bDiagClose"></button></div>
</div></div>

<div class="ov" id="ovPortrait" style="z-index:20"><div class="card">
  <div class="big">📱↻</div>
  <h2 id="rotTitle"></h2>
  <p id="rotText"></p>
  <button class="btn sub" id="bPortraitOk"></button>
</div></div>

<div class="cover" id="adCover"><span id="adText">Advertisement…</span></div>

  });
  const IS_LAB = !!root.TILT_LAB;
  const STAGES = IS_LAB ? LAB : S;
  const WORLDS = IS_LAB ? [{ id: 'lab', name: { ko: '효과 실험실', en: 'Effect Lab' } }] : [
    { id: 'hills', name: { ko: '언덕 마을', en: 'Hillside' } },
    { id: 'canyon', name: { ko: '협곡', en: 'Canyon' } },
    { id: 'storm', name: { ko: '폭풍 봉우리', en: 'Storm Peak' } }

  // 기준 시간(초): test/par.js가 모범 운전으로 잰 시간 × 1.1 (3★ ≤ par, 2★ ≤ par × 1.4)
  const PAR = IS_LAB ? [] : [7, 8.5, 9, 14.5, 24, 10.5, 7.5, 21, 15.5, 21.5, 10, 16.5, 18, 23.5, 31.5];

  function groundYAt(pieces, x) {
    for (const pc of pieces) {
      for (let i = 1; i < pc.length; i++) {
        const [x0, y0] = pc[i - 1], [x1, y1] = pc[i];
        if (x >= x0 && x <= x1 && x1 > x0) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
      }
    }
    return null;
  }
  function stars(index, time) {
    const par = PAR[index] || 999;
    return time <= par ? 3 : time <= par * 1.4 ? 2 : 1;
  }

  // ---------- 시뮬레이션 ----------
  function Sim(stageIndex) {
    const def = STAGES[stageIndex]();
    this.def = def; this.index = stageIndex;
    const world = this.world = new planck.World({ gravity: Vec2(0, -G) });
    let minY = Infinity;
    for (const pc of def.t.pieces) {
      if (pc.length < 2) continue;
      world.createBody().createFixture(Chain(pc.map(p => Vec2(p[0], p[1])), false), { friction: 0.95, userData: 'ground' });
      for (const p of pc) minY = Math.min(minY, p[1]);
    }
    const g0 = def.t.pieces[0][0];
    world.createBody().createFixture(Edge(Vec2(g0[0], g0[1]), Vec2(g0[0], g0[1] + 12)), { userData: 'wall' });
    for (const c of def.ceil) world.createBody().createFixture(Chain(c.map(p => Vec2(p[0], p[1])), false), { friction: 0.5, userData: 'ceil' });
    // 썩은 다리: 1m 판자들
    this.bridges = def.bridges.map(br => {
      const n = Math.round(br.x1 - br.x0);
      const w = (br.x1 - br.x0) / n;
      const planks = [];
      for (let i = 0; i < n; i++) {
        const body = world.createBody({ position: Vec2(br.x0 + (i + 0.5) * w, br.y - 0.12) });
        body.createFixture(Box(w / 2, 0.12), { density: 0.6, friction: 0.9, userData: 'plank' });
        planks.push({ body, fallen: false, fallAt: null });
      }
      return { def: br, planks, touchedAt: null };
    });
    // 검문소 차단기
    this.gates = def.gates.map(gt => {
      const gy = groundYAt(def.t.pieces, gt.x);
      const body = world.createBody();
      body.createFixture(Edge(Vec2(gt.x, gy), Vec2(gt.x, gy + 3)), { userData: 'gate' });
      return { def: gt, body, gy, open: false, holdTime: 0, lift: 0 };
    });
    this.killY = minY - 6;
    // [실험실] 루프: 앞 반쪽(분류 2)·뒤 반쪽(분류 4). 자전거는 꼭대기를 지나면 2 대신 4와 부딪힘
    this.loops = (def.loops || []).map(L => {
      const n = L.path.length, ov = 20, pick = (i0, i1) => { const pts = []; for (let i = i0; i < i1; i += 4) pts.push(Vec2(L.path[i][0], L.path[i][1])); pts.push(Vec2(L.path[i1][0], L.path[i1][1])); return pts; };
      const b = world.createBody();
      b.createFixture(Chain(pick(0, Math.min(n - 1, L.top + ov)), false), { friction: 0.95, userData: 'ground', filterCategoryBits: 2 });
      b.createFixture(Chain(pick(Math.max(0, L.top - ov), n - 1), false), { friction: 0.95, userData: 'ground', filterCategoryBits: 4 });
      return Object.assign({ passed: false, done: false }, L);
    });
    this.makeBike(def.start);
    this.airControl = !!def.lab;
    if (this.loops.length) this.setBikeMask(0xFFFB);
    this.phi = 0; this.time = 0; this.acc = 0;
    this.result = null;
    this.crashKind = null;
    this.backTime = 0; this.stopTime = 0; this.upsideTime = 0;
    this.maxX = 0;
    this.events = [];
    this.wasGrounded = 2; this.airTime = 0;
    this.windNow = 0;
    world.on('begin-contact', (c) => {
      const a = c.getFixtureA(), b = c.getFixtureB();
      const ua = a.getUserData(), ub = b.getUserData();
      const isRider = u => u === 'head' || u === 'torso';
      const isWorld = u => u === 'ground' || u === 'ceil' || u === 'wall' || u === 'gate' || u === 'plank';
      if (isRider(ua) && isWorld(ub)) this.crashKind = this.crashKind || ub;
      else if (isRider(ub) && isWorld(ua)) this.crashKind = this.crashKind || ua;
      if (ua === 'plank' || ub === 'plank') {
        const pb = (ua === 'plank' ? a : b).getBody();
        for (const br of this.bridges) if (br.touchedAt == null && br.planks.some(p => p.body === pb)) { br.touchedAt = this.time; this.events.push({ t: 'bridge' }); }
      }
    });
  }

  Sim.prototype.makeBike = function (x) {
    const world = this.world;
    const gy = groundYAt(this.def.t.pieces, x);
    const y = gy + R + 0.02;
    const grp = -1;
    const chassis = world.createDynamicBody({ position: Vec2(x, y + 0.1) });
    chassis.createFixture(Polygon([Vec2(-0.55, 0.06), Vec2(0.55, 0.06), Vec2(0.42, 0.46), Vec2(-0.36, 0.46)]),
      { density: 25, friction: 0.5, filterGroupIndex: grp, userData: 'frame' });
    chassis.createFixture(Box(0.14, 0.32, Vec2(-0.06, 0.86), -0.35),
      { density: 40, friction: 0.5, filterGroupIndex: grp, userData: 'torso' });
    chassis.createFixture(Circle(Vec2(0.1, 1.32), 0.16),
      { density: 40, friction: 0.5, filterGroupIndex: grp, userData: 'head' });
    const wheels = [];
    for (const dx of [-0.55, 0.55]) {
      const w = world.createDynamicBody({ position: Vec2(x + dx, y), angularDamping: 0.05 });
      w.createFixture(Circle(R), { density: 4, friction: 1.0, restitution: 0, filterGroupIndex: grp, userData: 'wheel' });
      const j = world.createJoint(WheelJoint({ enableMotor: false, frequencyHz: 4.5, dampingRatio: 0.7 }, chassis, w, w.getPosition(), Vec2(0, 1)));
      wheels.push({ body: w, joint: j });
    }
    this.chassis = chassis; this.wheels = wheels;
    this.mass = chassis.getMass() + wheels[0].body.getMass() + wheels[1].body.getMass();
    this.kDrag = Math.sin(MAX_TILT) * G * this.mass / (VT * VT);
  };

  function nearestIdx(path, p) { let bi = 0, bd = 1e9; for (let i = 0; i < path.length; i += 2) { const d = (path[i][0] - p.x) ** 2 + (path[i][1] - p.y) ** 2; if (d < bd) { bd = d; bi = i; } } return bi; }
  Sim.prototype.setBikeMask = function (mask) {
    for (const b of [this.chassis, ...this.wheels.map(w => w.body)])
      for (let f = b.getFixtureList(); f; f = f.getNext()) f.setFilterData({ groupIndex: -1, categoryBits: 1, maskBits: mask });
  };
  // [실험실] 바닥 재질: rr = 구름 저항, push = 내리막 가속 보탬(얼음), visc = 속도 비례 감속(진흙)
  const SURF = { ice: { rr: 0.002, push: 0.6, brake: 0.5 }, rock: { rr: 0.1 }, mud: { rr: 0.05, visc: 0.22 }, wet: { rr: 0.012, push: 0.1, brake: 0.25 } };
  Sim.prototype.surfaceAt = function (x) {
    const ss = this.def.surfaces; if (!ss) return null;
    for (const s of ss) if (x >= s.x0 && x <= s.x1) return s.type;
    return null;
  };
  // [실험실] 점프: 바퀴가 땅에 닿아 있을 때만
  Sim.prototype.jump = function () {
    if (this.result || this.grounded() === 0 || this.time - (this.lastJump == null ? -9 : this.lastJump) < 0.35) return false;
    const a = this.chassis.getAngle(), n = Vec2(-Math.sin(a), Math.cos(a)), J = 5.2;
    for (const b of [this.chassis, ...this.wheels.map(w => w.body)]) { const v = b.getLinearVelocity(); b.setLinearVelocity(Vec2(v.x + n.x * J, v.y + n.y * J)); }
    this.lastJump = this.time; this.jumps = (this.jumps || 0) + 1;

  Sim.prototype.grounded = function () {

      }
    }

  Sim.prototype.rearX = function () { return this.wheels[0].body.getPosition().x; };

    if (this.result) return;
    phi = Math.max(-MAX_TILT, Math.min(MAX_TILT, phi));

    this.world.setGravity(Vec2(G * Math.sin(phi), -G * Math.cos(phi)));

      this.acc -= DT;

    }

  Sim.prototype.fixedStep = function () {
    const ch = this.chassis;
    const v = ch.getLinearVelocity();
    const sp = v.length();
    const p = ch.getPosition();
    // [실험실] 루프 안은 레일 위처럼: 공기저항 15%, 서스펜션 단단하게
    const pp = ch.getPosition(), railNow = this.loops.length > 0 && this.loops.some(L => pp.x > L.x0 - 1 && pp.x < L.x1 + 1 && pp.y > L.y0 + R + 0.15);
    if (railNow !== !!this.rail) { this.rail = railNow; for (const w of this.wheels) w.joint.setSpringFrequencyHz(railNow ? 12 : 4.5); }
    const kd = this.kDrag * (railNow ? 0.15 : 1);
    if (sp > 0.01) {
      if (this.def.lab) { // [실험실] 공기저항을 무게 비율로 나눠 걸어 공중에서 앞이 들리지 않게
        for (const b of [ch, this.wheels[0].body, this.wheels[1].body]) { const sh = b.getMass() / this.mass, bv = b.getLinearVelocity(); b.applyForceToCenter(Vec2(-kd * bv.x * sp * sh, -kd * bv.y * sp * sh), true); }
      } else ch.applyForceToCenter(Vec2(-kd * v.x * sp, -kd * v.y * sp), true);
    }
    const gnd = this.grounded();
    if (this.def.lab) {   // [실험실] 공중 자세 조작: 공중에서 기울이면 자전거 앞뒤가 돎 (앞으로 = 앞이 숙여짐). 손을 놓으면 회전이 천천히 멈춤
      const air = gnd === 0 && !this.rail;

      if (!air) this.inAir = false; else this.airT += DT;

        if (Math.abs(u) > 0.12) {

      const sl = ya != null && yb != null ? Math.atan2(yb - ya, 1) : 0, tx = Math.cos(sl), ty = Math.sin(sl);

  function zoneOf(x) { const t = sim.def.tunnel; return t && x > t[0] && x < t[1] ? 'tunnel' : null; }
  function finish() {

    A.quiet();
    const last = stageIdx === C.stageCount - 1;
    if (r.ok) {
      const t = r.time, st = C.stars(stageIdx, t), prev = starsOf(stageIdx);
      const best = PROG.best[stageIdx];

      if (st > prev) PROG.stars[stageIdx] = st;

    } else {

        const onBridge = sim.def.bridges.some(b => x > b.x0 - 1 && x < b.x1 + 1);
        if (onBridge) { icon = '🪵'; title = T('failBridge'); text = T('failBridgeText'); }
        else { icon = '🕳️'; title = T('failGap'); text = T('failGapText'); }

  function drawBackground() {

  function drawTerrain() {

    const bottom = view.y - H / 2 / view.s - 3;

      grd.addColorStop(0, 'rgba(40,30,25,.0)'); grd.addColorStop(0.15, 'rgba(40,30,25,.85)'); grd.addColorStop(1, '#120c09');
      ctx.fillStyle = grd; ctx.fillRect(sx(g.x0), sy(ytop), (g.x1 - g.x0) * view.s, sy(fy) - sy(ytop));
      ctx.fillStyle = '#2a1d16'; ctx.fillRect(sx(g.x0) - 2, sy(fy), (g.x1 - g.x0) * view.s + 4, H * 3);
      ctx.fillStyle = 'rgba(90,70,55,.6)'; for (let x = g.x0 + 0.4; x < g.x1; x += 0.9) { ctx.beginPath(); ctx.arc(sx(x), sy(fy) + 2, 0.18 * view.s, 0, Math.PI * 2); ctx.fill(); }

      if (pc.length < 2 || pc[pc.length - 1][0] < left || pc[0][0] > right) continue;
      let i0 = 0, i1 = pc.length - 1;
      while (i0 < i1 && pc[i0 + 1][0] < left) i0++;

      ctx.beginPath(); ctx.moveTo(sx(pc[i0][0]), sy(pc[i0][1]));

      ctx.beginPath(); ctx.moveTo(sx(c[0][0]), sy(top));

  function wp(lx, ly) { const p = sim.chassis.getWorldPoint({ x: lx, y: ly }); return [sx(p.x), sy(p.y)]; }
  function line(a, b, w, color) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  function ik(hip, foot, l1, l2, bendSign) {

  }
  function drawBike(speed) {

      ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(cx, cy, 0.04 * s, 0, Math.PI * 2); ctx.fill();
    }
    const rw = sim.wheels[0].body.getPosition(), fw = sim.wheels[1].body.getPosition();
    const RA = [sx(rw.x), sy(rw.y)], FA = [sx(fw.x), sy(fw.y)];
    const BB = wp(-0.05, 0.14), SEAT = wp(-0.24, 0.56), HEAD = wp(0.38, 0.58), BAR = wp(0.44, 0.72);
    const fc = '#2b6cb0', fw2 = 0.07 * s;
    line(RA, BB, fw2, fc); line(RA, SEAT, fw2, fc); line(SEAT, BB, fw2, fc); line(BB, HEAD, fw2, fc); line(SEAT, HEAD, fw2, fc);

  const winds = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), l: 0.5 + Math.random() }));

  function fpCache() {
    if (fp.cacheFor === sim) return fp.cache;
    const pcs = sim.def.t.pieces;
    let x0 = Infinity, x1 = -Infinity;

  function renderFP(dt) {

    const ch = sim.chassis;
    const eye = fall ? (() => { const p = ch.getPosition(); return { x: p.x + 0.3, y: p.y + 1.3 }; })() : ch.getWorldPoint({ x: 0.16, y: 1.45 });

        const col = { rabbit: '#e07b00', turtle: '#2f8f4e', wind: '#3b82c4', stop: '#c94834', ice: '#3b9fd8', rock: '#7a6f66', mud: '#7a5233', jump: '#e8553d' }[sg.kind];

    // 결승 아치
    if (def.finish != null) {
      const L = pole(def.finish, -2.4, 3.0, '#333', 0.14), R = pole(def.finish, 2.4, 3.0, '#333', 0.14);
      if (L && R) items.push({ fw: L.fw, draw() {
        L.draw(); R.draw();
        const s = f / L.fw, h = 0.55 * s, n = 10, w = (R.Q[0] - L.Q[0]) / n;
        for (let r = 0; r < 2; r++) for (let c = 0; c < n; c++) { ctx.fillStyle = (r + c) % 2 ? '#111' : '#fff'; ctx.fillRect(L.Q[0] + c * w, L.Q[1] + r * h / 2, w + 0.5, h / 2 + 0.5); }
      } });
    }
    // 멈춤 구역 깃발 + 글씨
    const zoneFlags = (z, label) => {
      for (const x of [z.x0, z.x1]) for (const side of [-2.3, 2.3]) {
        const pl = pole(x, side, 2.2, '#333', 0.08); if (!pl) continue;
        items.push({ fw: pl.fw, draw() { pl.draw(); const s = f / pl.fw; ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.moveTo(pl.Q[0], pl.Q[1]); ctx.lineTo(pl.Q[0] - Math.sign(side) * 0.7 * s, pl.Q[1] + 0.2 * s); ctx.lineTo(pl.Q[0], pl.Q[1] + 0.4 * s); ctx.fill(); } });
      }
      if (label) {
        const mx = (z.x0 + z.x1) / 2, gy = fpLookup(fp.cache.ys, mx); if (isNaN(gy)) return;
        const P = proj(mx, gy + 3.0, lat(mx)); if (!P) return;
        items.push({ fw: P[2] - 0.01, draw() {
          const s = f / P[2]; ctx.font = 'bold ' + Math.max(8, Math.round(0.5 * s)) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const tw = ctx.measureText(label).width + 0.4 * s;
          ctx.fillStyle = 'rgba(15,29,43,.75)'; ctx.fillRect(P[0] - tw / 2, P[1] - 0.36 * s, tw, 0.72 * s);
          ctx.fillStyle = '#ffd43b'; ctx.fillText(label, P[0], P[1]);
        } });
      }
    };
    if (def.stopZone) zoneFlags(def.stopZone, T('stopHere'));
    // 검문소 차단기
    for (const gt of sim.gates) {
      zoneFlags(gt.def.zone, gt.open ? null : T('stopZone'));
      const x = gt.def.x, gy = gt.gy, l = lat(x);
      const base = proj(x, gy, l + 2.3), top = proj(x, gy + 1.15, l + 2.3);
      if (!base || !top) continue;
      items.push({ fw: base[2], draw() {
        const s = f / base[2];
        ctx.fillStyle = '#444'; ctx.fillRect(base[0] - 0.12 * s, top[1], 0.24 * s, base[1] - top[1]);
        const a = gt.lift * Math.PI / 2 * 0.92, len = 4.6;
        const end = proj(x, gy + 1.05 + Math.sin(a) * len, l + 2.3 - Math.cos(a) * len);
        if (!end) return;
        const n = 6;
        for (let k = 0; k < n; k++) {
          const t0 = k / n, t1 = (k + 1) / n;
          ctx.strokeStyle = k % 2 ? '#fff' : '#c94834'; ctx.lineWidth = Math.max(2, 0.2 * s); ctx.lineCap = 'butt';
          ctx.beginPath(); ctx.moveTo(top[0] + (end[0] - top[0]) * t0, top[1] + (end[1] - top[1]) * t0); ctx.lineTo(top[0] + (end[0] - top[0]) * t1, top[1] + (end[1] - top[1]) * t1); ctx.stroke();
        }
      } });
    }
    const lg = LAB ? { ctx, sim, proj, lat, f, HW, rd, W, H, dt } : null;
    if (LAB) { for (const it of LAB.fpItems(lg)) items.push(it); LAB.fogBegin(def); }
    items.sort((a, b) => b.fw - a.fw);
    for (const it of items) { if (LAB) LAB.fogAt(it.fw, ctx, W, H); it.draw(); }
    drawWind(snap.speed, snap.vx, snap.wind, dt);
    if (LAB) LAB.screen(lg, true);
    if (!fall || fall.impactT == null) drawHands(snap, dt);
    if (LAB) LAB.lensFx(lg);
    if (fall) drawFallFx(fall.lipY - eye.y);
    else if (sim.result && !sim.result.ok) { ctx.fillStyle = 'rgba(201,72,52,' + Math.min(0.35, endT * 0.5) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // 핸들과 두 손
  function drawHands(snap, dt) {
    const s = Math.min(W * 0.78, H * 1.45);
    const brake = phiDeg < -4 ? Math.min(1, (-phiDeg - 4) / 12) : 0;
    fp.bob += dt * (2 + snap.speed * 1.2);
    const bob = snap.grounded > 0 ? Math.sin(fp.bob) * Math.min(3, snap.speed * 0.25) : -4;
    const by = H * 0.9 + bob + fp.kick * H * 0.06;
    const cxh = W / 2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // 앞바퀴 윗부분
    ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = s * 0.045;
    ctx.beginPath(); ctx.arc(cxh, by + s * 0.33, s * 0.2, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();
    // 포크·스템
    ctx.strokeStyle = '#2b6cb0'; ctx.lineWidth = s * 0.03;
    ctx.beginPath(); ctx.moveTo(cxh - s * 0.05, by + s * 0.2); ctx.lineTo(cxh - s * 0.02, by + s * 0.02); ctx.moveTo(cxh + s * 0.05, by + s * 0.2); ctx.lineTo(cxh + s * 0.02, by + s * 0.02); ctx.stroke();
    ctx.strokeStyle = '#333'; ctx.lineWidth = s * 0.035;
    ctx.beginPath(); ctx.moveTo(cxh, by + s * 0.03); ctx.lineTo(cxh, by - s * 0.02); ctx.stroke();
    // 핸들바
    const gx = s * 0.36, gy = by - s * 0.035;
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = s * 0.03;
    ctx.beginPath(); ctx.moveTo(cxh - gx, gy); ctx.quadraticCurveTo(cxh, by - s * 0.06, cxh + gx, gy); ctx.stroke();
    // 브레이크 레버 (반대로 기울이면 당겨짐)
    ctx.strokeStyle = '#9aa3ad'; ctx.lineWidth = s * 0.012;
    for (const sd of [-1, 1]) {
      const x0 = cxh + sd * gx * 0.78, y0 = gy - s * 0.005;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + sd * s * 0.1, y0 - s * (0.06 - 0.045 * brake)); ctx.stroke();
    }
    // 종
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(cxh - gx * 0.45, gy - s * 0.02, s * 0.018, 0, Math.PI * 2); ctx.fill();
    // 팔과 장갑
    for (const sd of [-1, 1]) {
      const hx = cxh + sd * gx * 0.92, hy = gy;
      ctx.strokeStyle = '#e8553d'; ctx.lineWidth = s * 0.11;
      ctx.beginPath(); ctx.moveTo(cxh + sd * s * 0.62, H + s * 0.08); ctx.lineTo(hx + sd * s * 0.05, hy + s * 0.07); ctx.stroke();
      ctx.strokeStyle = '#f2c29b'; ctx.lineWidth = s * 0.075;
      ctx.beginPath(); ctx.moveTo(hx + sd * s * 0.05, hy + s * 0.07); ctx.lineTo(hx + sd * s * 0.015, hy + s * 0.025); ctx.stroke();
      ctx.fillStyle = '#26324a';
      ctx.beginPath(); ctx.ellipse(hx, hy, s * 0.06, s * 0.045, sd * 0.25, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = s * 0.006;
      for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(hx - s * 0.035 + k * 0.004 * s, hy - s * 0.02 + k * s * 0.02); ctx.lineTo(hx + s * 0.035, hy - s * 0.02 + k * s * 0.02); ctx.stroke(); }
    }
  }

  function drawCover(img) {
    // 화면을 꽉 채우게. 위쪽(하늘·헬멧)은 남기고 아래 풀밭을 잘라 내고, 좁은 화면에선 왼쪽 라이더 쪽을 보여 줌
    const r = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    const w = img.naturalWidth * r, h = img.naturalHeight * r;
    const x = Math.min(0, Math.max(W - w, W / 2 - 0.26 * w));
    ctx.drawImage(img, x, 0, w, h);
  }
  function render(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!sim) { ctx.fillStyle = THEMES[0].sky0; ctx.fillRect(0, 0, W, H); return; }
    if (demo && IMG.title && IMG.title.complete && IMG.title.naturalWidth) { drawCover(IMG.title); return; }
    if (SET.view !== 'side' && !demo) { renderFP(dt); return; }
    const snap = sim.snapshot();
    const base = Math.max(22, Math.min(W / 18, H / 8.5));
    const kz = Math.min(1, snap.speed / 14);
    const targetS = base * (1 - 0.18 * kz);
    view.s += (targetS - view.s) * (1 - Math.exp(-dt / 0.5));
    const look = Math.max(-2, Math.min(4.5, snap.vx * 0.35));
    const tx = snap.x + 2.5 + look, ty = snap.y + 1.2 + (LAB && !snap.grounded ? Math.max(-3.5, Math.min(0, sim.chassis.getLinearVelocity().y * 0.3)) : 0);   // [실험실] 빨리 떨어지면 아래를 더 보여 줌
    view.x += (tx - view.x) * (1 - Math.exp(-dt / 0.18));
    view.y += (ty - view.y) * (1 - Math.exp(-dt / (fall ? 0.08 : 0.3)));
    drawBackground();
    ctx.save();
    if (view.shake > 0) { ctx.translate((Math.random() - 0.5) * view.shake, (Math.random() - 0.5) * view.shake); view.shake = Math.max(0, view.shake - dt * 40); }
    if (LAB && LAB.shake && !sim.result) view.shake = Math.max(view.shake, LAB.shake * 0.6);
    drawTerrain();
    const lg = LAB ? { ctx, sx, sy, s: view.s, sim, W, H, dt, left: view.x - W / 2 / view.s - 2, right: view.x + W / 2 / view.s + 2 } : null;
    if (LAB) LAB.sideTerrain(lg);
    drawProps(); drawBike(snap.speed);
    if (LAB) LAB.sideParticles(lg);
    ctx.restore();
    drawWind(snap.speed, snap.vx, snap.wind, dt);
    if (LAB) LAB.screen(lg, false);
    if (fall) drawFallFx(fall.lipY - sim.chassis.getPosition().y);
  }

  // ---------- 진단 ----------
  function diagLines() {
    const g = Input.g;
    const ori = (screen.orientation && screen.orientation.angle != null) ? screen.orientation.angle : (window.orientation != null ? window.orientation : '-');
    const raw = Input.rawDeg();
    return [
      T('dScreen') + ': ' + (inFrame ? T('dFrame') : T('dDirect')) + ' · ' + location.protocol.replace(':', ''),
      T('dPerm') + ': ' + Input.perm,
      T('dEvents') + ': ' + Input.events + T('times') + (Input.rate ? ' (' + Input.rate.toFixed(0) + '/s)' : ''),
      T('dRaw') + ': ' + (g ? [g.x, g.y, g.z].map(v => (v == null ? '-' : v.toFixed(2))).join(', ') : T('dNone')),
      T('dZero') + ': ' + (Input.g0 ? Input.g0.x.toFixed(2) + ', ' + Input.g0.y.toFixed(2) : T('dNotSet')),
      T('dOri') + ': ' + ori + '°',
      T('dTilt') + ': ' + raw.toFixed(1) + '°  →  ' + T('dGame') + ': ' + Input.gameDeg(raw).toFixed(1) + '°',
      T('dPitch') + ': ' + Input.pitchDeg().toFixed(1) + '°  →  ' + T('dGame') + ': ' + Input.pitchGame(Input.pitchDeg()).toFixed(1) + '° (' + T('viewFP') + ')',
      T('dDir') + ': ' + (SET.invert ? T('dInverted') : T('dNormal')) + ' · ' + T('inputLabel') + ': ' + (Input.mode === 'tilt' ? T('inputTilt') : Input.mode === 'touch' ? T('inputTouch') : Input.mode === 'keys' ? T('inputKeys') : '-')
    ];
  }
  let backTo = 'ovWorlds';
  function openDiag(from) { if (from) backTo = from; $('bInvert').textContent = T('invert') + ' (' + (SET.invert ? T('on') : T('off')) + ')'; show('ovDiag'); }

  // ---------- 설정 ----------
  function seg(id, opts, cur, onPick) {
    const el = $(id); el.innerHTML = '';
    for (const [val, label] of opts) { const b = document.createElement('button'); b.textContent = label; b.className = val === cur ? 'on' : ''; b.onclick = () => { A.SFX.click(); onPick(val); openSettings(); }; el.appendChild(b); }
  }
  let resetArmed = false;
  function openSettings(from) {
    if (from) backTo = from;
    seg('segSound', [[true, T('on')], [false, T('off')]], SET.sound, v => { SET.sound = v; A.set('sound', v); saveSet(); });
    seg('segMusic', [[true, T('on')], [false, T('off')]], SET.music, v => { SET.music = v; A.set('music', v); saveSet(); });
    seg('segVib', [[true, T('on')], [false, T('off')]], SET.vib, v => { SET.vib = v; saveSet(); });
    const inputs = isTouchDevice ? [['tilt', T('inputTilt')], ['touch', T('inputTouch')]] : [['keys', T('inputKeys')]];
    seg('segInput', inputs, Input.mode, v => { if (v === 'tilt') enableTilt(); else { Input.mode = v; SET.input = v; saveSet(); applyTexts(); } });
    seg('segLang', [['ko', '한국어'], ['en', 'English']], L.lang, v => { L.set(v); SET.lang = v; saveSet(); applyTexts(); });
    seg('segView', [['fp', T('viewFP') + ' · ' + T('recMobile')], ['side', T('viewSide') + ' · ' + T('recPC')]], SET.view === 'side' ? 'side' : 'fp', v => { SET.view = v; saveSet(); applyTexts(); });
    $('bRecalib').style.display = Input.mode === 'tilt' && SET.view === 'side' ? '' : 'none';
    $('bDiag').style.display = isTouchDevice ? '' : 'none';
    $('bReset').textContent = resetArmed ? T('resetConfirm') : T('resetProgress');
    show('ovSettings');
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    phiDeg = Input.update(dt);
    const blocked = $('ovPortrait').classList.contains('show') || (anyOverlay() && !demo);
    if (sim && demo) {
      // 타이틀 뒤 시연: 10°로 달리다 끝나면 다시
      const snap = sim.snapshot();
      phiDeg = sim.result ? 0 : (snap.x > 55 ? -8 : 10);
      if (!sim.result) sim.step(phiDeg * DEG, dt); else { endT += dt; if (endT > 1.5) startStage(0, { demo: true }); }
      sim.drainEvents();
    } else if (sim && playing && !blocked) {
      sim.step(phiDeg * DEG, dt);
      for (const ev of sim.drainEvents()) {
        if (ev.t === 'jump') A.SFX.jump();
        else if (ev.t === 'land') { A.SFX.land(ev.v); fp.kick = Math.min(1.5, ev.v / 6); if (ev.v > 5) vibrate(15); if (LAB && ev.grade) { LAB.onLand(ev, L.lang); A.SFX.grade && A.SFX.grade(ev.grade); if (ev.grade === 'bad') vibrate([30, 20, 40]); } }
        else if (ev.t === 'gate') { A.SFX.gate(); vibrate(10); }
        else if (ev.t === 'bridge') A.SFX.bridge();
        else if (ev.t === 'crash') { if (ev.kind === 'gap' || ev.kind === 'cliff') { startFall(ev.kind); view.shake = 4; } else { A.SFX.crash(); vibrate([40, 30, 60]); view.shake = 10; } }
      }
      $('timer').textContent = sim.time.toFixed(1);
      if (sim.result) { endT = 0; playing = false; A.quiet(); }
      if (!sim.result && sim.backTime > 1.2 && !toastOn) setToast(T('backToast'), 4);
      A.update(sim.speed(), sim.grounded(), sim.windNow, dt);
      if (LAB) { LAB.update(sim, dt, SET.view !== 'side'); A.lab(LAB.surf, sim.speed(), sim.grounded() > 0, LAB.rain, dt); }
    } else if (sim && sim.result && !anyOverlay()) {
      sim.world.setGravity({ x: C.G * Math.sin(phiDeg * DEG), y: -C.G * Math.cos(phiDeg * DEG) });
      if (!(fall && fall.impactT != null)) sim.stepFree(dt);
      endT += dt;
      updateFall(dt);
      const done = sim.result.ok ? endT > 0.6 : fall ? (fall.impactT != null ? endT - fall.impactT > 1.0 : endT > 4) : endT > 1.2;
      if (done) { setToast(null); finish(); }
    }
    if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) $('hint').style.opacity = 0; }
    if ($('ovDiag').classList.contains('show')) $('diagText').textContent = diagLines().join('\n');
    render(dt);
    requestAnimationFrame(frame);
  }

  // ---------- 시작 흐름 ----------
  function firstScreen() {
    if (!isTouchDevice) { Input.mode = 'keys'; SET.input = 'keys'; applyTexts(); openWorlds(); return; }
    if (SET.input === 'touch') { Input.mode = 'touch'; applyTexts(); openWorlds(); return; }
    if (SET.input === 'tilt' && !inFrame) { enableTilt(); return; }
    $('inBtns').style.display = '';
    $('bTilt').style.display = hasMotion ? '' : 'none';
    $('inNote').innerHTML = inFrame ? T('inFrameNote') : (location.protocol !== 'https:' && location.hostname !== 'localhost' ? T('httpsNote') : '');
    show('ovInput');
  }
  function pauseGame() {
    if (!sim || !playing || demo) return;
    paused = true; CG.gameplayStop(); A.quiet();
    show('ovPause');
  }
  function resumeGame() { if (!sim || !paused) return; paused = false; show(null); CG.gameplayStart(); last = performance.now(); }

  // ---------- 버튼 ----------
  const on = (id, fn) => { $(id).addEventListener('click', (e) => { A.ensure(); fn(e); }); };
  $('title').addEventListener('click', (e) => { if (e.target.closest('.tbtns')) return; A.ensure(); A.SFX.click(); firstScreen(); });
  on('bLang', () => { L.set(L.lang === 'ko' ? 'en' : 'ko'); SET.lang = L.lang; saveSet(); applyTexts(); });
  on('bTitleSet', () => { A.SFX.click(); openSettings('title'); });
  on('bTilt', () => { A.SFX.click(); enableTilt(); });
  on('bTouch', () => { A.SFX.click(); useTouch(); });
  on('bRetryTilt', () => enableTilt());
  on('bUseTouch', () => useTouch());
  on('bCalibGo', () => { Input.calibrate(); A.SFX.click(); if (backTo === 'ovDiag') { backTo = 'ovSettings'; openDiag(); } else if (sim && !sim.result && !demo && paused) { show('ovPause'); } else openWorlds(); });
  $('ovCalib').addEventListener('pointerup', (e) => { if (e.target.id !== 'bCalibGo') $('bCalibGo').click(); });
  on('bWorldsBack', () => openTitle());
  on('bWorldsSet', () => openSettings('ovWorlds'));
  on('bStagesBack', () => openWorlds());
  on('bSetBack', () => { resetArmed = false; if (backTo === 'title') openTitle(); else if (backTo === 'ovPause') show('ovPause'); else if (backTo === 'ovStages') openStages(curWorld); else openWorlds(); });
  on('bRecalib', () => { backTo = backTo === 'ovPause' ? 'ovPause' : 'ovSettings'; show('ovCalib'); });
  on('bDiag', () => openDiag('ovSettings'));
  on('bReset', () => { if (!resetArmed) { resetArmed = true; $('bReset').textContent = T('resetConfirm'); setTimeout(() => { resetArmed = false; if ($('ovSettings').classList.contains('show')) $('bReset').textContent = T('resetProgress'); }, 4000); return; } PROG = { stars: {}, best: {} }; saveProg(); resetArmed = false; setToast(T('resetDone'), 2); openSettings(); });
  on('bDiagCalib', () => { backTo = 'ovDiag'; show('ovCalib'); });
  on('bInvert', () => { SET.invert = !SET.invert; saveSet(); openDiag(); });
  on('bDiagClose', () => openSettings());
  on('bPortraitOk', () => { allowPortrait = true; resize(); });
  on('bRestart', () => { if (sim && !demo) { A.SFX.click(); withAdMaybe(() => startStage(stageIdx)); } });
  on('bPause', () => { A.SFX.click(); pauseGame(); });
  on('bView', () => { A.SFX.click(); SET.view = SET.view === 'side' ? 'fp' : 'side'; saveSet(); applyTexts(); });
  on('bResume', () => { A.SFX.click(); resumeGame(); });
  on('bPRestart', () => { A.SFX.click(); startStage(stageIdx); });
  on('bPList', () => { A.SFX.click(); openStages(worldOf(stageIdx)); });
  on('bPSet', () => { A.SFX.click(); openSettings('ovPause'); });
  on('bNext', () => { A.SFX.click(); withAd(() => startStage((stageIdx + 1) % C.stageCount)); });
  on('bAgain', () => { A.SFX.click(); withAd(() => startStage(stageIdx)); });
  on('bList', () => { A.SFX.click(); openStages(worldOf(stageIdx)); });
  function withAdMaybe(fn) { fn(); }   // 플레이 중 다시 하기는 광고 없음

  cv.addEventListener('pointerdown', e => { A.ensure(); if (LAB && Input.mode !== 'touch') doJump(); if (Input.mode === 'touch' && playing) { Input.touchX = e.clientX; try { cv.setPointerCapture(e.pointerId); } catch (_) { } } });
  cv.addEventListener('pointermove', e => { if (Input.mode === 'touch' && Input.touchX != null) Input.touchX = e.clientX; });
  const up = () => { Input.touchX = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { Input.keyR = true; e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { Input.keyL = true; e.preventDefault(); }
    if ((e.key === 'r' || e.key === 'R') && sim && !demo && !anyOverlay()) startStage(stageIdx);
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (paused) resumeGame(); else pauseGame(); }
    if ((e.key === 'v' || e.key === 'V') && !anyOverlay()) { SET.view = SET.view === 'side' ? 'fp' : 'side'; saveSet(); }
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
    if (LAB && (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && !e.repeat) doJump();
    if ((e.key === 'Enter' || e.key === ' ') && current() === 'title') { A.ensure(); firstScreen(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') Input.keyR = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') Input.keyL = false;
  });
  window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.card')) e.preventDefault(); }, { passive: false });
  document.addEventListener('visibilitychange', () => { if (document.hidden && playing && !demo) pauseGame(); });
  window.addEventListener('blur', () => { if (playing && !demo) pauseGame(); });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  // 그림 (있으면)
  function loadImages() {
    const list = [['title', 'img/title.webp'], ['bg0', 'img/bg_hills.webp'], ['bg1', 'img/bg_canyon.webp'], ['bg2', 'img/bg_storm.webp']];
    for (const [k, src] of list) { const im = new Image(); im.onload = () => { IMG[k] = im; }; im.onerror = () => { }; im.src = src; }
  }

  // 시험용
  if (TEST) {
    window.__tb = {
      Input, SET, get sim() { return sim; }, get PROG() { return PROG; }, startStage: (i) => startStage(i), openWorlds, openStages, openTitle, useTouch, openSettings, finish,
      setAngle(d) { Input.testAngle = d; },
      state() { return { playing, paused, demo, result: sim && sim.result, overlay: current(), phiDeg, stage: stageIdx, time: sim && sim.time }; },
      unlockAll() { window.__unlockAll = true; }, L, C, A, CG
    };
  }

  // ---------- 부팅 ----------
  (async () => {
    resize();
    applyTexts();
    A.set('sound', SET.sound); A.set('music', SET.music);
    CG.onMute(m => { CG.S.sdkMuted = m; A.setMuted(m); });
    await CG.init();
    CG.loadingStart();
    if (CG.active()) {
      // 계정 저장이 있으면 그걸로, 없으면 이 브라우저 기록을 올림
      try {
        const p = await CG.dataGet('tiltbike.prog');
        if (p) { PROG = Object.assign({ stars: {}, best: {} }, JSON.parse(p)); try { localStorage.setItem('tiltbike.prog', p); } catch (e) { } }
        else saveProg();
      } catch (e) { }
    }
    if (!TEST || window.__images) loadImages();
    CG.loadingStop();
    $('cover').classList.remove('show');
    openTitle();
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
